<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>BEA Estimaciones</title>
  <script>
    // GitHub Pages SPA redirect: guarda la ruta y redirige a index.html
    var path = window.location.pathname;
    var base = '/bea-estimaciones-app';
    var route = path.replace(base, '') || '/';
    sessionStorage.setItem('spa-redirect', route + window.location.search + window.location.hash);
    window.location.replace(base + '/');
  </script>
</head>
<body></body>
</html>
